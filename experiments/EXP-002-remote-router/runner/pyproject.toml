[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-router-experiment"
version = "0.1.0"
description = "Authenticated EXP-002 remote router smoke and fault runner"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "liveconv-audio==0.1.0",
  "liveconv-evaluation==0.1.0",
  "liveconv-protocol==0.1.0",
  "liveconv-worker-runtime==0.1.0",
  "numpy>=2,<3",
  "websockets>=15,<17",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff==0.16.2",
]

[project.scripts]
liveconv-router-experiment = "liveconv_router_experiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liveconv_router_experiment = ["trace.schema.json"]

[tool.uv.sources]
liveconv-audio = { workspace = true }
liveconv-evaluation = { workspace = true }
liveconv-protocol = { workspace = true }
liveconv-worker-runtime = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires LIVECONV_LIVE_GATEWAY_URL, LIVECONV_API_TOKEN, and a disposable gateway",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
