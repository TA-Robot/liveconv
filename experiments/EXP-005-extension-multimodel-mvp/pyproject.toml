[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-exp005-extension-multimodel-mvp"
version = "0.1.0"
description = "Metadata-only EXP-005 multi-model Extension MVP evidence runner"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "ruff==0.16.2",
]

[project.scripts]
liveconv-exp005-extension-multimodel-mvp = "liveconv_exp005_extension_multimodel_mvp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liveconv_exp005_extension_multimodel_mvp = ["*.schema.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["exp005_tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
