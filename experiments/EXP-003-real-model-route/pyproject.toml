[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-real-model-route"
version = "0.1.0"
description = "Metadata-redacted EXP-003 real-model Gateway route harness"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "liveconv-protocol==0.1.0",
  "websockets>=15,<17",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff==0.16.2",
]

[project.scripts]
liveconv-real-model-route = "liveconv_real_model_route.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liveconv_real_model_route = ["trace.schema.json"]

[tool.uv.sources]
liveconv-protocol = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["exp003_tests"]
markers = [
  "live: requires an explicitly enabled disposable real-model Gateway",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
