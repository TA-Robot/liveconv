[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-worker-runtime"
version = "0.1.0"
description = "Isolated subprocess supervisor and conformance worker for liveconv"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["workers", "workers.runtime", "workers.conformance"]
package-dir = { workers = "." }

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".."]
testpaths = ["runtime/tests", "tests"]
