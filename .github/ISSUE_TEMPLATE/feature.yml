name: Feature or delivery item
description: Propose a traceable product or engineering change.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: input
    id: outcome
    attributes:
      label: User outcome
      description: Describe the observable outcome, not only the implementation.
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Source-of-truth links
      description: List FR/NFR/JP/GOV, ADR, EXP, LV, or risk IDs.
    validations:
      required: true
  - type: dropdown
    id: zone
    attributes:
      label: Primary ownership zone
      options:
        - apps/extension
        - services/audio
        - packages/protocol
        - packages/evaluation
        - experiments
        - docs and control plane
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List tests, measurements, and failure cases that prove completion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-scope
      description: Include latency, privacy, voice authorization, compatibility, and explicit non-goals.
    validations:
      required: true
