[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-stt"
version = "0.1.0"
description = "Revision-pinned Japanese STT evidence runner for liveconv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
faster-whisper = [
  "av==18.0.0",
  "ctranslate2==4.8.1",
  "faster-whisper==1.2.1",
  "numpy==2.5.1",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[project.scripts]
liveconv-stt = "liveconv_stt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liveconv_stt = ["py.typed", "real-run-requirements.txt", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "../evaluation/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
