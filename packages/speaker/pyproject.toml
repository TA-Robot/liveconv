[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveconv-speaker"
version = "0.1.0"
description = "Revision-pinned speaker-change evidence for liveconv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
speechbrain = [
  "packaging==26.3",
  "requests==2.32.5",
  "speechbrain==1.0.3",
  "torch==2.6.0",
  "torchaudio==2.6.0",
]
test = ["jsonschema>=4.23,<5", "pytest>=8.3,<9"]

[project.scripts]
liveconv-speaker = "liveconv_speaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liveconv_speaker = [
  "py.typed",
  "runtime-requirements.txt",
  "authorizations/*.json",
  "schemas/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
